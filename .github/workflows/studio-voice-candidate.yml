name: Studio voice candidate smoke (no deployment)
on:
  push:
    branches: [feat/integrated-server-studio-20261127]
    paths:
      - 'source/dialect-voice-engine/**'
      - '.github/workflows/studio-voice-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  piper-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: source/dialect-voice-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_voices test_prepare_reference
      - name: Download pinned public candidate assets
        run: |
          python -m pip install huggingface_hub==0.36.0
          python install_candidates.py "$RUNNER_TEMP/voice-models"
      - name: Build private CPU voice service
        run: docker build -t studio-voice-smoke .
      - name: Generate audition with no networking or production credentials
        run: |
          mkdir -p "$RUNNER_TEMP/voice-auditions"
          sudo chown 10001:10001 "$RUNNER_TEMP/voice-auditions"
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 128 \
            --read-only --tmpfs /tmp:size=96m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/voice-models:/models:ro" \
            -v "$RUNNER_TEMP/voice-auditions:/auditions" \
            studio-voice-smoke python service.py --audition /auditions gulf-female
          sudo chmod -R a+rX "$RUNNER_TEMP/voice-auditions"
          python - "$RUNNER_TEMP/voice-auditions/gulf-female.wav" <<'PY'
          import sys, wave, array, json
          with wave.open(sys.argv[1], "rb") as w:
              assert (w.getnchannels(), w.getframerate(), w.getsampwidth()) == (1, 16000, 2)
              pcm = array.array("h", w.readframes(w.getnframes()))
              assert 16000 < len(pcm) <= 512000
              assert max(abs(x) for x in pcm) > 100
              print(json.dumps({"durationSeconds": len(pcm)/16000, "peak": max(abs(x) for x in pcm), "sampleRate": 16000}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gulf-female-candidate-audition
          path: ${{ runner.temp }}/voice-auditions/gulf-female.wav
          if-no-files-found: error
          retention-days: 3
