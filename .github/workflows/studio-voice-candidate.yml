name: Egyptian voice quality trial (no deployment)
on:
  push:
    branches: [feat/integrated-server-studio-20261127]
    paths:
      - 'source/dialect-voice-engine/**'
      - '.github/workflows/studio-voice-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  egyptian-audition:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: source/dialect-voice-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m unittest -v test_voices test_prepare_reference
      - name: Download pinned Cairene quality candidate
        run: |
          python -m pip install huggingface_hub==0.36.0
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download("Rabe3/kemetone",revision="9d65fab8cd71bc31a248e53bd18fe94941753aa6",local_dir=os.path.join(os.environ["RUNNER_TEMP"],"kemetone"),allow_patterns=["config.json","kemetone.pth","voices/kemetone.pt","kemetone/*","kemetone/**/*","README.md"])
          PY
      - name: Build isolated neural runtime
        run: docker build -f Dockerfile.egyptian-trial -t atsh-egyptian-trial .
      - name: Generate NEW Egyptian dialogue and ads offline, bounded memory
        run: |
          mkdir -p "$RUNNER_TEMP/egyptian-auditions"
          sudo chown 10001:10001 "$RUNNER_TEMP/egyptian-auditions"
          docker run --rm --network none --cpus 1 --memory 1200m --memory-swap 1200m --pids-limit 128 \
            --read-only --tmpfs /tmp:size=64m,mode=1777,exec,nosuid,nodev --cap-drop ALL --security-opt no-new-privileges \
            -v "$RUNNER_TEMP/kemetone:/model:ro" -v "$RUNNER_TEMP/egyptian-auditions:/auditions" atsh-egyptian-trial
          sudo chmod -R a+rX "$RUNNER_TEMP/egyptian-auditions"
          cat "$RUNNER_TEMP/egyptian-auditions/metrics.json"
      - uses: actions/upload-artifact@v4
        with:
          name: egyptian-female-quality-auditions
          path: ${{ runner.temp }}/egyptian-auditions/
          if-no-files-found: error
          retention-days: 3
