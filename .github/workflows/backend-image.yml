name: Backend versioned Docker image

on:
  push:
    branches: [main]
    paths:
      - 'source/backend/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-main
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/backend/package-lock.json
      - name: Install dependencies
        working-directory: source/backend
        run: npm ci
      - name: Syntax check
        working-directory: source/backend
        run: npm run check
      - name: Backend tests
        working-directory: source/backend
        run: npm test
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push immutable version
        uses: docker/build-push-action@v6
        with:
          context: ./source/backend
          file: ./source/backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
