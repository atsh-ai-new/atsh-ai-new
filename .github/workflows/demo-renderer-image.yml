name: Demo thumbnail renderer image
on:
  push:
    branches: [main]
    paths: ['source/backend/thumbnail-renderer/**','.github/workflows/demo-renderer-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: source/backend/thumbnail-renderer
          push: true
          tags: ghcr.io/atsh-ai-new/atsh-ai-new/demo-renderer:sha-${{ github.sha }}
