name: ATSH English & Arabic CI
on:
  push:
    branches: [fix/full-english-localization-20261118]
    paths: ['source/**', '.github/workflows/i18n-validation.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-strip-types --test tests/live-domain-rdap.test.mjs
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
