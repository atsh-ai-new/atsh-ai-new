name: ATSH AI build verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/customer-journey-verification-20261121]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/backend
    steps:
      - name: Free disk space before Node setup
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
