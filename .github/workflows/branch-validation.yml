name: Branch validation (no deployment)
on:
  push:
    branches:
      - fix/unified-data-flows-20261121
      - audit/admin-dashboard-modernization-20261122
      - fix/admin-mobile-project-team-controls-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atsh_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: atsh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atsh_ci -d atsh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v4
      - name: Apply schema on empty database
        run: psql -h localhost -U atsh_ci -d atsh_ci -v ON_ERROR_STOP=1 -f source/backend/db/schema.sql
      - name: Verify project archive migration can be applied twice
        run: |
          psql -h localhost -U atsh_ci -d atsh_ci -v ON_ERROR_STOP=1 -f source/backend/db/journey_project_archive_20261122.sql
          psql -h localhost -U atsh_ci -d atsh_ci -v ON_ERROR_STOP=1 -f source/backend/db/journey_project_archive_20261122.sql
      - name: Exercise team and project deletion on PostgreSQL
        run: psql -h localhost -U atsh_ci -d atsh_ci -v ON_ERROR_STOP=1 -f source/backend/test/admin-deletion-smoke.sql
      - name: Exercise project task creation and updates
        run: psql -h localhost -U atsh_ci -d atsh_ci -v ON_ERROR_STOP=1 -f source/backend/test/journey-tasks-smoke.sql

