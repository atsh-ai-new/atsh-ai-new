<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>عيادتي — معاينة تفاعلية</title><style>body{margin:0;font-family:Tahoma,Arial;background:#f4f7fa;color:#193445}*{box-sizing:border-box}.wrap{display:flex;min-height:100vh}aside{width:230px;background:#0a384b;color:white;padding:20px;flex-shrink:0}aside h1{font-size:30px}nav button{display:block;width:100%;background:transparent;color:#dbeaf0;text-align:right;margin:4px 0}button{cursor:pointer;border:0;border-radius:9px;background:#087e91;color:white;padding:12px 15px;font:inherit}nav button.active{background:#1d6a7d}main{flex:1;min-width:0;padding:25px}.muted{color:#6e8490;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid #e5edf2;border-radius:15px;padding:20px;margin-bottom:14px}.card strong{display:block;font-size:27px;margin-top:12px;color:#087e91}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:540px;text-align:right}th,td{border-bottom:1px solid #eef2f5;padding:12px}th{color:#6e8490}input,select,textarea{width:100%;padding:11px;border:1px solid #cad7dd;border-radius:9px;font:inherit}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:13px}dialog{border:0;border-radius:15px;padding:24px;width:min(520px,95%);box-shadow:0 20px 80px #112b3f55}dialog::backdrop{background:#142c3d99}.secondary{background:#eaf1f4;color:#215568}.tag{background:#dff4ed;color:#11624c;border-radius:20px;padding:5px 10px}.actions{display:flex;gap:5px;flex-wrap:wrap}p.notice{background:#fff1c9;padding:12px;border-radius:8px}@media(max-width:700px){.wrap{display:block}aside{width:auto;padding:12px}aside h1{font-size:23px;margin:8px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}main{padding:12px}.form{grid-template-columns:1fr}}</style></head><body><div class="wrap"><aside><h1>🩺 عيادتي</h1><p>لوحة الطبيب</p><nav id="nav"></nav></aside><main><header class="row"><div><h2 id="title">الرئيسية</h2><p class="muted">معاينة تجريبية تفاعلية — بدون قاعدة بيانات أو بيانات حقيقية</p></div><button class="secondary" id="reset">إعادة تعيين</button></header><div id="area"></div><p class="muted" id="feedback" aria-live="polite"></p></main></div><dialog id="modal"><div class="row"><h3 id="modalTitle"></h3><button id="close" class="secondary">إغلاق</button></div><form id="form" class="form"></form></dialog><script>(()=>{const pages={home:'الرئيسية',patients:'المرضى',appointments:'المواعيد',visits:'الكشوفات',prescriptions:'الروشتات',invoices:'الفواتير',settings:'الإعدادات'},today=new Date().toISOString().slice(0,10),seed=()=>({patients:[{id:1,name:'مريض تجريبي ١',phone:'01000000001',age:34},{id:2,name:'مريض تجريبي ٢',phone:'01000000002',age:45}],appointments:[{id:1,patient:1,date:today,time:'10:00',status:'مؤكد'},{id:2,patient:2,date:today,time:'11:30',status:'انتظار'}],visits:[{id:1,patient:1,date:today,diagnosis:'متابعة تجريبية'}],prescriptions:[],invoices:[{id:1,patient:1,amount:300,status:'مدفوع'}],settings:{clinic:'عيادتي',doctor:'د. الطبيب',specialty:'طب عام'}});let data=seed(),page='home',editing=null;const $=x=>document.querySelector(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),patient=id=>data.patients.find(x=>x.id==id)?.name||'غير معروف';const configs={patients:[['name','الاسم','text'],['phone','الهاتف','tel'],['age','العمر','number']],appointments:[['patient','المريض','patient'],['date','التاريخ','date'],['time','الساعة','time'],['status','الحالة','status']],visits:[['patient','المريض','patient'],['date','التاريخ','date'],['diagnosis','التشخيص والملاحظات','textarea']],prescriptions:[['patient','المريض','patient'],['date','التاريخ','date'],['medications','تفاصيل الروشتة','textarea']],invoices:[['patient','المريض','patient'],['amount','المبلغ','number'],['status','الحالة','payment']]};function table(type,rows){if(!rows.length)return '<p>لا توجد سجلات بعد.</p>';return '<div class="scroll"><table><thead><tr>'+configs[type].map(f=>'<th>'+f[1]+'</th>').join('')+'<th>إجراء</th></tr></thead><tbody>'+rows.map(x=>'<tr>'+configs[type].map(f=>'<td>'+esc(f[2]==='patient'?patient(x[f[0]]):x[f[0]])+'</td>').join('')+'<td><div class="actions"><button class="secondary" data-edit="'+type+':'+x.id+'">تعديل</button><button class="secondary" data-remove="'+type+':'+x.id+'">حذف</button></div></td></tr>').join('')+'</tbody></table></div>'}function render(){ $('#nav').innerHTML=Object.entries(pages).map(([key,val])=>'<button class="'+(page===key?'active':'')+'" data-page="'+key+'">'+val+'</button>').join('');$('#title').textContent=pages[page];if(page==='home'){let stats=[['إجمالي المرضى',data.patients.length],['مواعيد اليوم',data.appointments.filter(x=>x.date===today).length],['الكشوفات',data.visits.length],['إجمالي الفواتير',data.invoices.reduce((n,x)=>n+Number(x.amount),0)+' ج.م']];$('#area').innerHTML='<section class="stats">'+stats.map(x=>'<div class="card">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</section><div class="panel"><div class="row"><h3>مواعيد اليوم</h3><button data-add="appointments">موعد جديد</button></div>'+table('appointments',data.appointments.filter(x=>x.date===today))+'</div><div class="panel"><h3>إجراءات سريعة</h3><div class="actions"><button data-add="patients">مريض جديد</button><button data-add="visits">كشف جديد</button><button data-add="prescriptions">روشتة</button><button data-add="invoices">فاتورة</button></div></div>';return;}if(page==='settings'){$('#area').innerHTML='<div class="panel"><h3>إعدادات العيادة</h3><form id="settingsForm" class="form">'+Object.entries(data.settings).map(([k,v])=>'<label>'+({clinic:'اسم العيادة',doctor:'اسم الطبيب',specialty:'التخصص'}[k])+'<input name="'+k+'" value="'+esc(v)+'" required></label>').join('')+'<button>حفظ</button></form></div><p class="notice">هذا عرض تجريبي لا يصلح لتخزين بيانات طبية حقيقية.</p>';$('#settingsForm').onsubmit=e=>{e.preventDefault();data.settings=Object.fromEntries(new FormData(e.target));$('#feedback').textContent='تم حفظ إعدادات المعاينة';render()};return;}$('#area').innerHTML='<section class="panel"><div class="row"><h3>'+pages[page]+' ('+data[page].length+')</h3><button data-add="'+page+'">إضافة جديد</button></div>'+table(page,data[page])+'</section>';}function input(f,item){let [k,l,t]=f,v=item?.[k]??(t==='date'?today:'');let control=t==='patient'?'<select name="'+k+'" required><option value="">اختر المريض</option>'+data.patients.map(p=>'<option value="'+p.id+'" '+(String(v)===String(p.id)?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>':t==='status'||t==='payment'?'<select name="'+k+'">'+(t==='status'?['انتظار','مؤكد','مكتمل','ملغي']:['غير مدفوع','مدفوع','جزئي']).map(s=>'<option '+(v===s?'selected':'')+'>'+s+'</option>').join('')+'</select>':t==='textarea'?'<textarea name="'+k+'" required>'+esc(v)+'</textarea>':'<input name="'+k+'" type="'+t+'" value="'+esc(v)+'" '+(t==='number'?'min="0"':'')+' required>';return '<label>'+l+control+'</label>';}function open(type,id){let record=id?data[type].find(x=>x.id===id):null;editing={type,id};$('#modalTitle').textContent=(id?'تعديل ':'إضافة ')+pages[type];$('#form').innerHTML=configs[type].map(f=>input(f,record)).join('')+'<button>حفظ</button>';$('#modal').showModal()}$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};$('#area').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.add)open(b.dataset.add,null);if(b.dataset.edit){const [t,id]=b.dataset.edit.split(':');open(t,Number(id))}if(b.dataset.remove){const [t,id]=b.dataset.remove.split(':');if(confirm('حذف السجل التجريبي؟')){data[t]=data[t].filter(x=>x.id!=id);render()}}};$('#form').onsubmit=e=>{e.preventDefault();let {type,id}=editing,o=Object.fromEntries(new FormData(e.target));if(id){let i=data[type].findIndex(x=>x.id===id);data[type][i]={...data[type][i],...o}}else{data[type].push({...o,id:Math.max(0,...data[type].map(x=>x.id))+1})}$('#modal').close();render();$('#feedback').textContent='تم حفظ بيانات العرض'};$('#close').onclick=()=>$('#modal').close();$('#reset').onclick=()=>{if(confirm('إعادة جميع بيانات المعاينة؟')){data=seed();render()}};render()})();</script></body></html>
