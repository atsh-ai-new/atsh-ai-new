const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n||0).toLocaleString('ar-EG')+' ج.م';function save(){try{localStorage.setItem('avocato_demo_v2',JSON.stringify(data))}catch{/* sandboxed preview: memory-only */}}function toast(m){let e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}function login(e){e.preventDefault();if(document.getElementById('username').value==='admin'&&document.getElementById('password').value==='admin'){try{sessionStorage.setItem('avocato_login','1')}catch{/* sandboxed preview */}document.getElementById('login').classList.add('hide');render()}else toast('بيانات الدخول التجريبية غير صحيحة')}function logout(){try{sessionStorage.removeItem('avocato_login')}catch{/* sandboxed preview */}document.getElementById('login').classList.remove('hide')}try{if(sessionStorage.getItem('avocato_login')==='1')document.getElementById('login').classList.add('hide')}catch{/* sandboxed preview starts logged out */}function nav(v){view=v;render()}function render(){document.getElementById('menu').innerHTML=Object.keys(titles).map(k=>`<button class="${view===k?'active':''}" onclick="nav('${k}')"><span>${icons[k]}</span><span class="label">${titles[k]}</span></button>`).join('');document.getElementById('pageTitle').textContent=titles[view];document.getElementById('content').innerHTML=view==='dashboard'?dashboard():view==='reports'?reports():view==='settings'?settings():listing(view)}function labelStatus(s){return `<span class="badge ${/قيد|انتظار|متوسطة|مجدولة/.test(s)?'warn':/موقوفة|ملغاة|عالية/.test(s)?'red':''}">${esc(s)}</span>`}function dashboard(){let pending=data.finance.reduce((a,v)=>a+(+v.amount||0)-(+v.paid||0),0);return `<div class="hero"><div><h2>مساء الخير، أهلاً بك في أفوكاتو</h2><p>إدارة موحدة للقضايا والجلسات والعملاء والأتعاب، بواجهة عربية متكاملة.</p></div><div class="pill">✧ وضع المعاينة التفاعلية</div></div><div class="cards"><div class="card"><small>إجمالي القضايا</small><strong>${data.cases.length}</strong><em>جميع ملفات المكتب</em></div><div class="card"><small>القضايا النشطة</small><strong>${data.cases.filter(x=>x.status!=='مغلقة').length}</strong><em>قضايا قيد المتابعة</em></div><div class="card"><small>الجلسات المجدولة</small><strong>${data.hearings.filter(x=>x.result==='مجدولة').length}</strong><em>تحديث لحظي تجريبي</em></div><div class="card"><small>الأتعاب المتبقية</small><strong style="font-size:23px">${money(pending)}</strong><em>مستحقات على العملاء</em></div></div><div class="grid"><section class="panel"><div class="headrow"><h3>آخر القضايا</h3><button class="link" onclick="nav('cases')">عرض الكل ←</button></div>${table('cases',data.cases.slice(0,4),false)}</section><section class="panel"><div class="headrow"><h3>الجلسات القادمة</h3><button class="link" onclick="nav('hearings')">الأجندة ←</button></div>${data.hearings.filter(x=>x.result==='مجدولة').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(x=>`<div class="item"><div><strong>${esc(x.case)}</strong><small>${esc(x.court)} · ${esc(x.lawyer)}</small></div><span class="badge warn">${esc(x.date)}</span></div>`).join('')||'<div class="empty">لا توجد جلسات</div>'}</section></div><div class="grid"><section class="panel"><h3>المهام المطلوب إنجازها</h3>${data.tasks.filter(x=>x.status!=='مكتملة').map(x=>`<div class="item"><div><strong>${esc(x.title)}</strong><small>${esc(x.assignee)} · ${esc(x.due)}</small></div><button class="btn mini" onclick="completeTask(${x.id})">إنجاز</button></div>`).join('')||'<div class="empty">كل المهام مكتملة</div>'}</section><section class="panel"><h3>اختصارات العمليات</h3><div class="links"><button class="btn" onclick="openForm('cases')">+ قضية جديدة</button><button class="btn secondary" onclick="openForm('clients')">+ موكل</button><button class="btn secondary" onclick="openForm('hearings')">+ جلسة</button><button class="btn secondary" onclick="openForm('finance')">+ أتعاب</button></div><div class="note">البيانات التجريبية محفوظة محليًا في هذا المتصفح. لا تستخدم بيانات موكلين حقيقية في المعاينة.</div></section></div>`}function completeTask(id){let t=data.tasks.find(x=>x.id===id);if(t)t.status='مكتملة';save();render();toast('تم إنجاز المهمة')}
const cols={cases:['number','title','client','court','status','next'],clients:['name','phone','type','email'],hearings:['case','date','time','court','result'],tasks:['title','case','assignee','due','status'],finance:['client','case','amount','paid'],documents:['name','case','category','date'],team:['name','role','email','status'],consultations:['client','topic','date','channel','status']};function colname(k,key){return (fields[k].find(x=>x[0]===key)||[])[1]||key}function table(k,rows,actions=true){if(!rows.length)return '<div class="empty">لا توجد سجلات مطابقة</div>';return `<table class="table"><thead><tr>${cols[k].map(c=>`<th>${colname(k,c)}</th>`).join('')}${actions?'<th>الإجراءات</th>':''}</tr></thead><tbody>${rows.map(r=>`<tr>${cols[k].map(c=>`<td>${/status|result/.test(c)?labelStatus(r[c]):['amount','paid'].includes(c)?money(r[c]):esc(r[c])}</td>`).join('')}${actions?`<td><button class="link" onclick="openForm('${k}',${r.id})">تعديل</button><button class="link" onclick="openDetails('${k}',${r.id})">تفاصيل</button><button class="link" style="color:#be5151" onclick="removeItem('${k}',${r.id})">حذف</button></td>`:''}</tr>`).join('')}</tbody></table>`}function listing(k){return `<div class="headrow"><div><h2>${titles[k]}</h2><p class="sub">إدارة وتحديث السجلات وإجراءات المكتب</p></div><button class="btn" onclick="openForm('${k}')">+ إضافة جديد</button></div><div class="panel"><div class="toolbar"><input id="search" placeholder="بحث في ${titles[k]}..." oninput="filterTable()"><select id="filter" onchange="filterTable()"><option value="">كل السجلات</option>${[...new Set(data[k].map(x=>x.status||x.result||x.type||'').filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div id="records">${table(k,data[k])}</div></div>`}function filterTable(){let q=document.getElementById('search').value.trim().toLocaleLowerCase('ar'),f=document.getElementById('filter').value;document.getElementById('records').innerHTML=table(view,data[view].filter(x=>Object.values(x).join(' ').toLocaleLowerCase('ar').includes(q)&&(!f||Object.values(x).includes(f))))}function closeModal(){document.getElementById('modalbg').style.display='none'}function showModal(t,b){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=b;document.getElementById('modalbg').style.display='flex'}function openForm(k,id){let row=id?data[k].find(x=>x.id===id):{};let body=`<form id="recordForm" onsubmit="storeRecord(event,'${k}',${id||0})"><div class="form">${fields[k].map(([key,label,type])=>{let val=row[key]??'',control=type?.startsWith('select:')?`<select name="${key}" required><option value="">اختر...</option>${(type.substring(7).includes('|')?type.substring(7).split('|'):data[type.substring(7)]?.map(x=>x.name||x.title)||[]).map(opt=>`<option value="${esc(opt)}" ${opt===val?'selected':''}>${esc(opt)}</option>`).join('')}</select>`:`<input name="${key}" type="${type||'text'}" value="${esc(val)}" ${key==='notes'?'':'required'} ${type==='number'?'min="0" step="0.01"':''}>`;return `<label class="field ${key==='notes'?'full':''}">${label}${control}</label>`}).join('')}</div><div class="actions"><button class="btn" type="submit">حفظ السجل</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form>`;showModal((id?'تعديل':'إضافة')+' — '+titles[k],body)}function storeRecord(e,k,id){e.preventDefault();const values=Object.fromEntries(new FormData(e.target));if(k==='finance'&&(+values.paid>+values.amount)){toast('المحصّل لا يمكن أن يزيد على الأتعاب');return}if(['cases','hearings'].includes(k)&&values.next&&values.next<'2000-01-01'){toast('تاريخ غير صالح');return}if(id){let i=data[k].findIndex(x=>x.id===id);data[k][i]={...data[k][i],...values}}else data[k].unshift({id:Math.max(0,...data[k].map(x=>x.id))+1,...values});save();closeModal();render();toast('تم حفظ السجل محلياً')}function removeItem(k,id){if(!confirm('هل تريد حذف هذا السجل من بيانات المعاينة؟'))return;data[k]=data[k].filter(x=>x.id!==id);save();render();toast('تم حذف السجل')}function openDetails(k,id){let x=data[k].find(x=>x.id===id);showModal('تفاصيل السجل',Object.entries(x).filter(([a])=>a!=='id').map(([a,b])=>`<div class="detail"><label>${esc(colname(k,a))}</label><b>${esc(b)}</b></div>`).join('')+`<button class="btn" onclick="closeModal();openForm('${k}',${id})">تعديل</button>`)}function reports(){let total=data.finance.reduce((s,r)=>s+(+r.amount||0),0),paid=data.finance.reduce((s,r)=>s+(+r.paid||0),0),types=[...new Set(data.cases.map(x=>x.type))];return `<div class="headrow"><h2>التقارير والتحليلات</h2><button class="btn secondary" onclick="exportCSV('cases')">تصدير القضايا CSV</button></div><div class="cards"><div class="card"><small>إجمالي التعاقدات</small><strong style="font-size:22px">${money(total)}</strong></div><div class="card"><small>إجمالي المحصّل</small><strong style="font-size:22px">${money(paid)}</strong></div><div class="card"><small>المتبقي للتحصيل</small><strong style="font-size:22px">${money(total-paid)}</strong></div><div class="card"><small>معدل التحصيل</small><strong>${total?Math.round(100*paid/total):0}%</strong></div></div><div class="grid"><div class="panel"><h3>القضايا حسب التخصص</h3>${types.map(t=>`<div class="item" style="display:block"><b>${esc(t)} — ${data.cases.filter(x=>x.type===t).length}</b><div class="statbar"><span style="width:${data.cases.length?100*data.cases.filter(x=>x.type===t).length/data.cases.length:0}%"></span></div></div>`).join('')}</div><div class="panel"><h3>التصدير</h3><p class="sub">تقارير قابلة للتنزيل للاستخدام التجريبي.</p>${Object.keys(fields).map(k=>`<div class="item"><b>${titles[k]}</b><button class="btn mini secondary" onclick="exportCSV('${k}')">CSV ↓</button></div>`).join('')}</div></div>`}function exportCSV(k){let items=data[k],headers=fields[k].map(x=>x[0]),csv='\ufeff'+[headers.join(','),...items.map(r=>headers.map(h=>'"'+String(r[h]??'').replaceAll('"','""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='avocato-'+k+'.csv';a.click();URL.revokeObjectURL(a.href)}function settings(){return `<div class="headrow"><h2>إعدادات النظام</h2></div><section class="panel"><h3>بيانات المكتب</h3><div class="detail"><label>اسم النظام</label><b>أفوكاتو | AVOCATO</b></div><div class="detail"><label>وضع التشغيل</label><b>معاينة مستقلة — Local Storage</b></div><div class="detail"><label>قاعدة البيانات والخادم</label><b>غير مرتبطين — جاهز لتحديد إعدادات الاتصال الآمن أثناء النشر</b></div><div class="detail"><label>إدارة الصلاحيات</label><b>تصميم فقط: يتطلب تطبيق التحكم على API والخادم قبل الاستخدام الحقيقي</b></div><button class="btn secondary" onclick="resetDemo()">استعادة بيانات المعاينة</button></section><section class="panel"><h3>ملاحظات الأمان</h3><p class="sub">لا تضع مستندات قانونية أو معلومات موكلين فعلية داخل هذه المعاينة. نماذج المستندات هنا بيانات وصفية، وليست خدمة رفع وتخزين ملفات. تفعيل الهوية الحقيقية، تشفير البيانات، عزل المكاتب، إدارة الأدوار، سجل التدقيق، النسخ الاحتياطية والتخزين الآمن لازم قبل الإطلاق.</p></section>`}function resetDemo(){if(confirm('استعادة كل بيانات العرض؟')){data=structuredClone(seed);save();render();toast('استُعيدت بيانات التجربة')}}render();
</script></body></html>
