services:
  layered-worker:
    build: .
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    pids_limit: 128
    environment:
      ATSH_API_URL: ${ATSH_API_URL:?Set API origin}
      LAYERED_WORKER_TOKEN: ${LAYERED_WORKER_TOKEN:?Set secret}
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
